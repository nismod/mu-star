# Settings for the energy rules in workflow/0-preprocess/energy.smk.
# Paths are relative to the data folder: `data/` unless `data_root` is set in
# config/config.yaml. Source data is read from incoming/Infrastructure/Energy/,
# laid out as on the project's shared drive.

energy:
  # Folder under data/processed/energy/ that the rules read and write: the name
  # of a model-data pack. For new processed files, use a new name. Analysis results
  # go to data/results/energy/<date>-results, with the pack's date.
  model_data: 20261012-model-data

  # Area of the inferred networks. "mauritius-rodrigues" downloads each island
  # from OpenStreetMap and joins them (REGION_GROUPS in src/energy/osm.py). Any
  # OpenStreetMap place name also works, e.g. "Rodrigues, Mauritius".
  region: mauritius-rodrigues

  osm:
    # osmnx network type. "drive" gives the drivable roads that the estimated
    # distribution lines follow; "all" would add footpaths and tracks.
    network_type: drive
    # Optional files to use instead of the OpenStreetMap download: GeoParquet,
    # GeoPackage or GeoJSON. null uses
    # incoming/Infrastructure/Energy/OpenStreetMap/<region>/.
    roads: null   # road lines
    aoi: null     # island outlines, used to clip the night-light image

  base_network:
    # Join gaps shorter than this between CEB route segments.
    route_gap_tolerance_m: 75
    # CEB routes are 66 kV. 10,000 MVA so that no line limits flow; replace
    # with CEB ratings.
    default_voltage_kv: 66
    topology_capacity_mva: 10000

  inferred:
    # Connect a substation or plant to the nearest road point within this
    # distance.
    max_anchor_distance_m: 1000
    # Road segments: 11 kV, 5 MVA (a typical overhead 11 kV feeder, about
    # 260 A). Placeholder.
    topology_voltage_kv: 11
    topology_capacity_mva: 5
    # CEB 66 kV lines (inferred-provided only): 50 MVA, typical for a single
    # 66 kV circuit of the 150 mm2 conductor in the annual report (2023-24,
    # p. 61). CEB does not publish ratings per line; the criticality analysis
    # rates each line by its circuits instead (criticality below).
    transmission_voltage_kv: 66
    transmission_capacity_mva: 50
    # Line from each substation or plant to the road: 137 MVA, the average of
    # 2,595 MVA of transformers over 19 major substations (annual report
    # 2023-24, p. 60).
    anchor_capacity_mva: 137
    # Checks in validation.json: CEB's total of 10,492.2 km of transmission and
    # distribution lines, and the differences allowed before a warning.
    ceb_total_line_length_km: 10492.2
    line_length_tolerance_fraction: 0.10
    generation_capacity_tolerance_fraction: 0.10

  population:
    # WorldPop 2020 "constrained" grid: people per 100 m cell, adjusted to UN
    # totals, for the whole country including Rodrigues. Saved to
    # incoming/Infrastructure/Energy/Population/.
    url: https://data.worldpop.org/GIS/Population/Global_2000_2020_Constrained/2020/maxar_v1/MUS/mus_ppp_2020_UNadj_constrained.tif

  demand:
    # Weights of an area's share of night-light radiance and of population in
    # its demand score (src/energy/demand.py). PyPSA-Earth uses 0.6 for GDP and
    # 0.4 for population; night lights replace GDP here.
    weight_nightlights: 0.6
    weight_population: 0.4

  criticality:
    # Unmet demand when each substation, provided line or plant of
    # inferred-provided fails (workflow/2-losses/energy.smk).
    # Two optional tables in the incoming folder, here read from CEB's network
    # map. line_circuits gives each line's route, the voltage it was built for
    # and its circuits; without it, the segments between two substations or
    # junctions form one line, with one circuit built for the voltage it runs
    # at. substation_names names the substations; without it, they keep their
    # ids.
    line_circuits: Power Transmission/ceb_line_circuits.csv
    substation_names: Substation/ceb_substation_names.csv
    # PyPSA line type of one circuit, by the voltage a line was built for. A
    # line's rating is that type's rating at the voltage the line runs at in
    # the network (inferred.transmission_voltage_kv, 66 kV), times its
    # circuits: 149-AL1/24-ST1A, the 150 mm2 conductor in the annual report
    # (p. 61), 53.7 MVA at 66 kV; 243-AL1/39-ST1A, PyPSA-Earth's type for
    # 132 kV, 73.7 MVA at 66 kV. Placeholders until CEB gives ratings.
    line_types:
      66: 149-AL1/24-ST1A 110.0
      132: 243-AL1/39-ST1A 110.0
    # Share of a line's rating usable after a failure. PyPSA-Earth uses 0.7 as
    # a margin for failures it does not model; here each failure is modelled.
    s_max_pu: 1.0
    # Plants that keep supply going in a part of the network cut off from the
    # rest. Solar and wind farms disconnect when the grid is lost.
    island_carriers: [thermal, hydro]

  nightlight:
    # Keep roads within this distance of a lit pixel or a power asset.
    nightlight_support_distance_m: 1000
    # Threshold of the GridFinder filter that picks out lit pixels.
    nightlight_threshold: 0.1
    # Optional radiance image (GeoTIFF) to use instead of building one from
    # the monthly images below.
    nightlights: null
    # Monthly VIIRS images, from an ArcGIS image service of the Earth
    # Observation Group's monthly cloud-free composites. object_ids are the
    # twelve months of 2024; change them for another year, and bbox for
    # another area.
    source:
      service: https://di-lawimagery1.img.arcgis.com/arcgis/rest/services/NighttimeLightsMDNB/ImageServer
      rendering_rule: "Average Monthly Radiance (Raw Values)"
      object_ids: [120, 121, 122, 123, 124, 125, 126, 127, 128, 129, 130, 131]
      bbox: [57, -21, 64, -19]
      pixel_size_degrees: 0.004166666666666667
      monthly_dir: incoming/Infrastructure/Energy/Nighttime Lights/viirs-2024-monthly
