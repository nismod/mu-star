# This file contains configuration options for mu-star analysis.
# These values are used by snakemake rules in the `workflow/` directory.

metadata:
  # Asset layers: one row per processed asset file, see docs/src/damages.md
  layer: "config/layer.csv"
  # Hazards: one row per peril/subperil data cube, see docs/src/damages.md
  hazard: "config/hazard.csv"

damage:
  # Damage configuration workbook: asset types, hazards, vulnerability, costs
  # and damage curves. Git-ignored, so place your copy here; see
  # example/config/ for the structure.
  config: "config/damage/asset-type-cost-curves.xlsx"
  # Number of Monte Carlo samples per asset/scenario
  n_samples: 10000
  # Quantiles to report, for damages per return period and for expected
  # annual damages
  quantiles: [0.05, 0.5, 0.95]
  # Random seed, used for every snail call (all asset types, layers and hazards), so
  # results are reproducible. The systemic cost and curve choice draws are then the
  # same across asset types, layers and hazards; per-asset draws are independent.
  seed: 20261114
  # Coefficient of variation of hazard intensity (0 for no hazard uncertainty)
  hazard_cv: 0.0
  # Standard deviation of multiplicative damage fraction noise (0 for none)
  eta_sd: 0.0
  # Projected CRS (metres) used to measure split lengths and areas.
  # EPSG:32740 is UTM zone 40S, covering Mauritius (use 32741 for Rodrigues)
  measure_crs: "EPSG:32740"
  # Fail if an asset type in the data is missing from the damage config, or
  # is vulnerable but missing curves or costs. Otherwise warn, and give NaN.
  strict: false

sensitivity:
  vars:
    # TODO: Some data structure, or path to a file containing data structure
    # describing how sensitive inputs might be varied, e.g.
    # - flood damage curve x shift (min & max?)
    # - wind damage curve y shift (min & max?)
    # - rehabilitation cost multiplier (min & max?)
    # - etc.

