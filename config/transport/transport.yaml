# Settings for the land transport (journey-to-work) analysis.
#
# Rules: workflow/0-preprocess/transport_land.smk (zones, networks, OD) and
#        workflow/2-losses/transport_land.smk (baseline assignment, criticality).
# Docs:  docs/src/infrastructure-transport.md
#
# File paths are relative to the data root (the {data} wildcard, normally `data/`).
#
# DRAFT: values marked TODO are placeholders to be agreed or sourced.

transport_land:
  # Only the main island for now: Rodrigues has no commuting link to Mauritius
  # and would form a disconnected sub-network. TODO: decide whether to run it
  # as a separate study area.
  study_area: mauritius-main-island

  # Metric CRS for lengths, buffers and nearest-neighbour searches.
  # EPSG:32740 is WGS 84 / UTM zone 40S. EPSG:3337 (Le Pouce 1934 / Mauritius
  # Grid) would also work.
  crs_metric: "EPSG:32740"

  # --- Provided inputs (schemas: docs/src/infrastructure-transport.md) --------
  inputs:
    census_table: incoming/Socio-economic/Census/census-residential-zones.xlsx  # TODO: actual file name
    census_sheet: null  # null = first sheet
    census_columns:     # map census spreadsheet headers to our names
      zone_id: TODO_zone_code
      population: TODO_total_population
      employed_residents: TODO_employed_population
    census_boundaries: incoming/Socio-economic/Census/census-residential-zones.gpkg  # TODO
    census_boundaries_zone_id: TODO_zone_code
    worldpop: incoming/Population/WorldPop/mus_ppp_2020_constrained.tif  # TODO: year / product
    # The H3 economic activity layer is produced by a mu-star rule
    # (economic_activity_h3, currently a stub), not given as a path here. It is
    # wide: one row per cell, one column of output per sector.
    economic_activity_columns:
      cell: h3_index
      # Sector output columns: every column starting with this prefix
      # (the rest of the name is the sector code, e.g. "gva_C").
      sector_prefix: "gva_"
    # Sectoral productivity, output per worker, to turn output into jobs.
    # Columns: sector, output_per_worker (same currency and year as the
    # activity layer). TODO: build from Statistics Mauritius national accounts
    # and employment by industry. If the file is missing, output is used as
    # relative attractiveness only.
    output_per_worker: incoming/Socio-economic/GDP/output-per-worker-by-sector.csv
    roads: incoming/Infrastructure/Transport/road/roads.gpkg
    bus_stops: incoming/Infrastructure/Transport/bus/bus_stops.gpkg
    bus_routes: incoming/Infrastructure/Transport/bus/bus_routes.gpkg
    bus_route_stops: incoming/Infrastructure/Transport/bus/bus_route_stops.csv
    metro_stations: incoming/Infrastructure/Transport/metro/metro_stations.gpkg
    metro_line: incoming/Infrastructure/Transport/metro/metro_line.gpkg
    metro_line_stations: incoming/Infrastructure/Transport/metro/metro_line_stations.csv

  # --- Population ------------------------------------------------------------
  population:
    # How WorldPop is used. "scale" multiplies each pixel so that every census
    # zone matches its official total. "check" only reports the comparison and
    # leaves WorldPop untouched (we would not normally use this).
    worldpop_mode: scale
    # Flag census zones where WorldPop and the census disagree by more than this
    # (ratio of census to WorldPop, outside [1/x, x]).
    check_ratio_tolerance: 1.5

  # --- Jobs (destination mass) -------------------------------------------------
  jobs:
    # Scale total jobs to equal total employed residents (closed-island assumption).
    scale_to_employed_residents: true
    # ISIC sections to leave out of commuting destinations, e.g. A (agriculture)
    # if those workers mostly live on site. TODO: agree.
    exclude_sectors: []

  # --- OD estimation: radiation model -----------------------------------------
  radiation:
    # The impedance used to rank destinations: free-flow road time ("time_min")
    # or distance ("length_km").
    impedance: time_min
    # Destinations further than this are not considered (in impedance units).
    max_impedance: 120
    # Mass at the origin (m_i). The radiation formula is stated in "opportunity"
    # units. With m_i = jobs, cells with no jobs send nobody anywhere useful
    # (all trips go to the nearest job cell). "employed_residents" with jobs
    # scaled to the same total avoids that. See the docs.
    origin_mass: employed_residents
    # "finite": Simini's 1/(1 - m_i/M) correction. "row": renormalise each
    # origin's probabilities to sum to 1 over reachable destinations, so that
    # every employed resident makes exactly one trip.
    normalisation: row
    # Share of employed residents who work in their own cell and do not use
    # the network. TODO: unknown, so 0 for now. Could depend on cell jobs/workers.
    intrazonal_share: 0.0
    # Drop OD pairs below this many trips. The dropped trips are spread back
    # over each origin's remaining pairs.
    min_trips: 0.5

  # --- Mode split (no mode-choice data; fixed shares) --------------------------
  mode_split:
    # Shares by trip distance band (road km, upper bound inclusive). Each row
    # must sum to 1. Walk-only trips are removed from network assignment.
    # Bus and metro are separate modes with their own centroids: bus trips use
    # only the bus network, and metro trips only the metro line (walking to and
    # from stations).
    # TODO: research. These could be derived from ridership statistics
    # (metro daily boardings, bus passengers) divided by commuting trips.
    bands:
      - {max_km: 2,    walk: 0.40, car: 0.35, bus: 0.25, metro: 0.00}
      - {max_km: 10,   walk: 0.00, car: 0.55, bus: 0.40, metro: 0.05}
      - {max_km: 1000, walk: 0.00, car: 0.60, bus: 0.32, metro: 0.08}
    # The metro share applies only where both ends have a station within
    # connectors.metro_walk_max_km. Elsewhere it goes to this mode.
    metro_fallback: bus
    # What happens to bus or metro demand that does not fit within capacity:
    # "unserved" (report it) or "car" (reassign it to the road network).
    pt_overflow: unserved

  # --- Assignment period and units ---------------------------------------------
  period:
    # Flows are persons. Daily one-way commuting trips are reduced to the
    # modelled peak period by this factor.
    peak_period_share: 0.6
    peak_period_hours: 2.0
    car_occupancy: 1.3  # persons per vehicle, to compare with road capacity

  # --- Generalised cost ---------------------------------------------------------
  # cost = per_minute * time_min + per_km[mode] * length_km + fare
  # Units: MUR per person-trip.
  cost:
    currency: MUR
    per_minute: 3.0  # value of travel time, MUR per person-minute. TODO
    per_km:
      car: 8.0       # vehicle operating cost per vehicle-km / occupancy. TODO
      bus: 0.0       # fares on boarding links instead
      metro: 0.0
      walk: 0.0
    fare:
      bus: 0.0       # Bus travel is free for many users in Mauritius. TODO: confirm
      metro: 0.0     # TODO: Metro Express fares (stage-based, higher than bus)
    # Multipliers on time spent waiting, walking and transferring (perceived time).
    weight:
      wait: 1.5
      walk: 1.5
      transfer_penalty_min: 5.0
    # Trips that cannot be made at all under disruption (isolated demand)
    # are counted, not costed.

  # --- Network construction -------------------------------------------------------
  road:
    # Free-flow speed (km/h) and capacity (vehicles/hour/direction) by road class,
    # used where the edge has no speed or capacity of its own.
    defaults:
      motorway:     {speed_kph: 90, capacity_vph: 3600}
      trunk:        {speed_kph: 70, capacity_vph: 2400}
      primary:      {speed_kph: 60, capacity_vph: 1800}
      secondary:    {speed_kph: 50, capacity_vph: 1200}
      tertiary:     {speed_kph: 40, capacity_vph: 900}
      unclassified: {speed_kph: 30, capacity_vph: 600}
      residential:  {speed_kph: 25, capacity_vph: 600}
      service:      {speed_kph: 15, capacity_vph: 300}
    # Bus and metro are capacity constrained. Roads are not, by default.
    capacity_constrained: false
  connectors:
    # Each zone centroid joins its k nearest road nodes / PT stops within the radius.
    car_k: 3
    car_max_km: 2.0
    car_speed_kph: 20
    walk_max_km: 1.0        # zone bus centroid to bus stops
    metro_walk_max_km: 2.0  # zone metro centroid to metro stations
    walk_speed_kph: 4.5
    walk_detour_factor: 1.3
    # No bus <-> metro transfers for now: bus and metro trips stay on their
    # own networks. TODO: feeder bus to metro stations.
  bus:
    # Frequencies and between-stop timings are provided per route. These
    # defaults are used only where they are missing.
    default_headway_min: 20
    # Standard vehicle size (passengers, seated + standing). TODO: confirm.
    vehicle_capacity: 70
    # Only used where a between-stop time is missing: bus in-vehicle speed as a
    # share of car free-flow speed on the same road edges, plus dwell time.
    speed_factor: 0.7
    dwell_min: 0.5
  metro:
    default_headway_min: 6
    train_capacity: 1500  # TODO: confirm for Metro Express rolling stock
    default_speed_kph: 35  # used if no run times are provided

  # --- Criticality --------------------------------------------------------------
  criticality:
    # Asset types that are failed one at a time:
    #   road           a road edge, plus the bus segments that run over it
    #   metro          a metro segment between two stations (both directions)
    #   metro_station  a station closure: no boarding or alighting there
    #                  (trains still run through)
    fail: [road, metro, metro_station]
    # Only fail road edges in these classes (null = all, the default). Assets
    # with no baseline flow are always skipped.
    road_classes: null
    min_baseline_flow: 1.0
    # Failure scenarios are split into this many batches (snakemake jobs).
    n_batches: 64
