# To install this environment:
# micromamba create -f environment.yaml -y
name: mu-star
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip:
    - -e .
    - nismod-snail
    - osmium
    - matplotlib_scalebar
    - osmnx
    - contextily
    - reverse_geocoder
    - seaborn
    - 'pymc==5.25.1'
    - 'arviz==0.22.0'
    - 'blackjax==1.3'
    - 'pytensor==2.31.7'
    - scalenav
    - matplotlib_map_utils
  - geopandas
  - hatchling
  - jupyter
  - netCDF4
  - notebook
  - numpy
  - matplotlib
  - pyarrow
  - pytest
  - bioconda::snakemake
  - tqdm
  - xarray
  - zarr
  - 'duckdb==1.3.2'
  - 'pyarrow==21.0.0'
  - geoarrow-pyarrow
  - 'ibis-framework[duckdb,geospatial]'  
  - pydeck
