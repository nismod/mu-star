# To install this environment:
# micromamba create -f environment.yaml -y
name: mu-star
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  # Build requirements for nismod-snail from git (C++ extension), on any platform
  - cxx-compiler
  - cmake
  - pip:
      - -e .[dev]
      # Branch feat/direct-damage-interface, for the unreleased simulate_direct_damages.
      # Return to a release when one is available.
      - nismod-snail @ git+https://github.com/nismod/snail@90f46f36a6896b376af32f6f0bcef9298eab91a8
      - osmium
  - geopandas
  - hatchling
  - highspy
  - jupyter
  - matplotlib
  - nbstripout
  - netCDF4
  - networkx
  - notebook
  - numpy>=1.26,<2
  - openpyxl
  - osmnx>=2
  - pandas>=2,<3
  - pdoc
  - plotly>=6
  - pre-commit
  # pyarrow 26 requires numpy>=2; 19-25 work with numpy 1.26
  - pyarrow<26
  - click
  - dask
  - rioxarray
  - pypsa>=0.30,<0.31
  - pytest
  - scipy
  - shapely
  - bioconda::snakemake
  - terracotta==0.9.1
  - tqdm
  - xarray
  - zarr
