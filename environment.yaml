# To install this environment:
# micromamba create -f environment.yaml -y
name: mu-star
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - git
  - pip:
    - -e .
    - nismod-snail
    - osmium
    - matplotlib_scalebar
    - osmnx
    - contextily
    - reverse_geocoder
    - seaborn
    - matplotlib_map_utils
  - geopandas
  - hatchling
  - jupyter
  - netCDF4
  - notebook
  - numpy
  - matplotlib
  - pyarrow
  - pytest
  - bioconda::snakemake
  - tqdm
  - xarray
  - zarr
