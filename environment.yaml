# To install this environment:
# micromamba create -f environment.yaml -y
name: mu-star
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip:
      - -e .[dev]
      - nismod-snail
      - osmium
  - geopandas
  - hatchling
  - jupyter
  - netCDF4
  - notebook
  - numpy
  - matplotlib
  - pdoc
  - pyarrow
  - pytest
  - bioconda::snakemake
  - terracotta==0.9.1
  - tqdm
  - xarray
  - zarr
