# To install this environment:
# micromamba create -f environment.yaml -y
name: mu-star
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip:
      - -e .[dev]
      - nismod-snail
      # transport_flow_model, pinned to a git commit until a working release is
      # published (radiation model changes, branch claude/land-transport-workflow-draft-j0njkf).
      # Builds a Rust extension with maturin, hence rust below.
      - nismod-tfm @ git+https://github.com/nismod/transport_flow_model@d08031a9333d6c5e1262f1fbac9424efd795132e
      - h3>=4
      - osmium
  - geopandas
  - hatchling
  - highspy
  - jupyter
  - matplotlib
  - nbstripout
  - netCDF4
  - networkx
  - notebook
  - numpy>=1.26,<2
  - openpyxl
  - osmnx>=2
  - pandas>=2,<3
  - pdoc
  - plotly>=6
  - pre-commit
  - pyarrow
  - pypsa>=0.30,<0.31
  - pytest
  - rust  # to build nismod-tfm from git
  - scipy
  - shapely
  - bioconda::snakemake
  - terracotta==0.9.1
  - tqdm
  - xarray
  - xlrd  # census .xls workbooks
  - zarr
